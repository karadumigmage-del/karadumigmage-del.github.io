<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>National Explorer - English Assessment</title>
    <style>
        :root {
            --ng-yellow: #FFCC00;
            --ng-dark: #121212;
            --ng-gray: #2A2A2A;
            --ng-text: #FFFFFF;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--ng-dark);
            color: var(--ng-text);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 600px;
            background-color: var(--ng-gray);
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            box-sizing: border-box;
            border-top: 5px solid var(--ng-yellow);
        }
        h1, h2, h3 { text-align: center; }
        .header-logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }
        .yellow-box {
            width: 30px;
            height: 40px;
            background-color: var(--ng-yellow);
        }
        input[type="text"] {
            width: 100%;
            padding: 12px;
            margin: 10px 0 20px 0;
            border: 1px solid #444;
            border-radius: 4px;
            background-color: #1e1e1e;
            color: white;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 15px;
            background-color: var(--ng-yellow);
            color: var(--ng-dark);
            border: none;
            border-radius: 4px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 10px;
            transition: background-color 0.2s;
        }
        button:hover { background-color: #e6b800; }
        button.secondary {
            background-color: transparent;
            color: var(--ng-yellow);
            border: 2px solid var(--ng-yellow);
        }
        button.secondary:hover { background-color: rgba(255, 204, 0, 0.1); }
        button.danger {
            background-color: #cc0000;
            color: white;
            border: none;
        }
        button.danger:hover { background-color: #990000; }
        
        .hidden { display: none !important; }
        .info-bar {
            display: flex;
            justify-content: space-between;
            background: #1e1e1e;
            padding: 10px;
            border-radius: 4px;
            margin-bottom: 20px;
            font-size: 14px;
        }
        .options-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
        }
        .option-btn {
            background-color: #1e1e1e;
            color: white;
            border: 1px solid #444;
            text-align: left;
            padding: 15px;
            font-weight: normal;
        }
        .option-btn:hover { background-color: #333; }
        .option-btn.selected {
            background-color: rgba(255, 204, 0, 0.2);
            border-color: var(--ng-yellow);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            padding: 10px;
            text-align: left;
            border-bottom: 1px solid #444;
        }
        th { color: var(--ng-yellow); }
    </style>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

<div class="container" id="login-screen">
    <div class="header-logo">
        <div class="yellow-box"></div>
        <h2>NATIONAL EXPLORER</h2>
    </div>
    <h3 style="margin-top: 0;">English Proficiency Assessment</h3>
    <p style="text-align: center; font-size: 14px; color: #aaa;">Enter your nickname to begin the adaptive test.</p>
    <input type="text" id="nickname-input" placeholder="Your Nickname / ชื่อเล่น" autocomplete="off">
    <button onclick="login()">Start Assessment</button>
    <button class="secondary" onclick="showLeaderboard()">View Leaderboard</button>
</div>

<div class="container hidden" id="quiz-screen">
    <div class="info-bar">
        <span id="player-name-display"></span>
        <span id="part-display">Part: 1/3</span>
        <span id="timer-display" style="color: var(--ng-yellow); font-weight: bold;">15:00</span>
    </div>
    
    <div id="question-area">
        <p id="question-type" style="font-size: 12px; color: #aaa; text-transform: uppercase; margin-bottom: 5px;"></p>
        <h3 id="question-text" style="margin-top: 0; line-height: 1.4;">Question loads here...</h3>
        <button id="play-audio-btn" class="secondary hidden" style="width: auto; padding: 5px 15px; margin-bottom: 15px;">🔊 Play Audio</button>
        <div class="options-container" id="options-area"></div>
    </div>
    
    <button id="next-btn" onclick="submitAnswer()" disabled style="background-color: #555; color: #888; cursor: not-allowed;">Confirm & Next</button>
    <button class="danger" onclick="confirmEarlyExit()" style="margin-top: 20px; font-size: 12px; padding: 10px;">End Test & Save Score</button>
</div>

<div class="container hidden" id="result-screen">
    <div class="header-logo">
        <div class="yellow-box"></div>
        <h2>ASSESSMENT COMPLETE</h2>
    </div>
    <div style="text-align: center;">
        <h1 style="color: var(--ng-yellow); font-size: 48px; margin: 10px 0;" id="final-score">0</h1>
        <p>Total Points</p>
        <h2 id="cefr-level" style="margin-bottom: 5px;">Level: --</h2>
        <p id="cefr-desc" style="color: #aaa; font-size: 14px; margin-bottom: 30px;"></p>
    </div>
    <button onclick="showLeaderboard()">View Global Leaderboard</button>
    <button class="secondary" onclick="location.reload()">Return Home</button>
</div>

<div class="container hidden" id="leaderboard-screen">
    <div class="header-logo">
        <div class="yellow-box"></div>
        <h2>GLOBAL LEADERBOARD</h2>
    </div>
    <div style="max-height: 300px; overflow-y: auto;">
        <table id="leaderboard-table">
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Score</th>
                    <th>Level</th>
                    <th>Date</th>
                </tr>
            </thead>
            <tbody id="leaderboard-body">
                <tr><td colspan="4" style="text-align: center;">Loading data...</td></tr>
            </tbody>
        </table>
    </div>
    <button style="margin-top: 20px;" onclick="location.reload()">Back to Home</button>
</div>

<script>
    // ==========================================
    // 1. นำค่า config จาก Firebase ของคุณมาใส่ตรงนี้
    // ==========================================
    const firebaseConfig = {
        apiKey: "YOUR_API_KEY",
        authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
        databaseURL: "https://YOUR_PROJECT_ID-default-rtdb.firebaseio.com",
        projectId: "YOUR_PROJECT_ID",
        storageBucket: "YOUR_PROJECT_ID.appspot.com",
        messagingSenderId: "YOUR_SENDER_ID",
        appId: "YOUR_APP_ID"
    };

    // Initialize Firebase
    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.database();

    // ==========================================
    // 2. Question Database (40 Questions total)
    // ==========================================
    const questionsDb = [
        // A1 Level
        { level: 'A1', type: 'grammar', q: "The sun ___ in the east.", opts: ["rise", "rises", "rising", "rose"], ans: 1 },
        { level: 'A1', type: 'vocab', q: "A ___ is an animal with a long neck.", opts: ["lion", "elephant", "giraffe", "bear"], ans: 2 },
        { level: 'A1', type: 'conversation', q: "A: How are you? \nB: ___", opts: ["I am fine, thank you.", "I am John.", "Yes, please.", "See you tomorrow."], ans: 0 },
        { level: 'A1', type: 'listening', q: "What color is the sky on a clear day?", opts: ["Green", "Blue", "Red", "Yellow"], ans: 1 },
        { level: 'A1', type: 'grammar', q: "I ___ a student.", opts: ["is", "am", "are", "be"], ans: 1 },
        { level: 'A1', type: 'vocab', q: "We use our ___ to see.", opts: ["ears", "eyes", "nose", "hands"], ans: 1 },
        { level: 'A1', type: 'conversation', q: "A: What is your name? \nB: ___", opts: ["I am fine.", "My name is Sarah.", "I am 20 years old.", "I live here."], ans: 1 },
        { level: 'A1', type: 'listening', q: "I have a pet dog. It likes to play.", opts: ["Cat", "Dog", "Bird", "Fish"], ans: 1 },
        { level: 'A1', type: 'grammar', q: "They ___ playing football.", opts: ["is", "am", "are", "do"], ans: 2 },
        { level: 'A1', type: 'vocab', q: "An apple is a type of ___.", opts: ["vegetable", "meat", "fruit", "drink"], ans: 2 },
        
        // A2 Level
        { level: 'A2', type: 'grammar', q: "She ___ to the zoo yesterday.", opts: ["goes", "went", "gone", "going"], ans: 1 },
        { level: 'A2', type: 'vocab', q: "The Amazon is a very long ___.", opts: ["mountain", "river", "desert", "forest"], ans: 1 },
        { level: 'A2', type: 'conversation', q: "A: What time does the tour start? \nB: ___", opts: ["It's in the park.", "At 9:00 AM.", "Yes, it starts.", "I like tours."], ans: 1 },
        { level: 'A2', type: 'listening', q: "The weather today is very cold and snowy.", opts: ["Hot and sunny", "Rainy", "Cold and snowy", "Windy"], ans: 2 },
        { level: 'A2', type: 'grammar', q: "I have ___ been to Africa.", opts: ["ever", "never", "always", "sometimes"], ans: 1 },
        { level: 'A2', type: 'vocab', q: "Penguins live in a very cold ___.", opts: ["environment", "city", "desert", "jungle"], ans: 0 },
        { level: 'A2', type: 'conversation', q: "A: Would you like some water? \nB: ___", opts: ["No, I don't.", "Yes, please.", "Water is good.", "I like water."], ans: 1 },
        { level: 'A2', type: 'listening', q: "Please turn off your phones during the movie.", opts: ["Turn on phones", "Turn off phones", "Use phones", "Call friends"], ans: 1 },
        { level: 'A2', type: 'grammar', q: "If it rains, we ___ stay home.", opts: ["would", "will", "did", "are"], ans: 1 },
        { level: 'A2', type: 'vocab', q: "A person who studies stars is an ___.", opts: ["astronomer", "doctor", "teacher", "farmer"], ans: 0 },

        // B1 Level
        { level: 'B1', type: 'grammar', q: "By the time we arrived, the expedition ___ already left.", opts: ["has", "have", "had", "was"], ans: 2 },
        { level: 'B1', type: 'vocab', q: "Many species are facing ___ due to habitat loss.", opts: ["extinction", "evolution", "creation", "population"], ans: 0 },
        { level: 'B1', type: 'conversation', q: "A: I think we should take the trail on the left. \nB: ___", opts: ["I couldn't agree more.", "I don't think.", "Yes, left is.", "No, trail."], ans: 0 },
        { level: 'B1', type: 'listening', q: "The documentary highlights the impact of climate change on polar bears.", opts: ["City life", "Climate change", "Cooking", "Space"], ans: 1 },
        { level: 'B1', type: 'grammar', q: "He is used to ___ in cold weather.", opts: ["work", "working", "worked", "works"], ans: 1 },
        { level: 'B1', type: 'vocab', q: "The scientist conducted an ___ to test the theory.", opts: ["experience", "experiment", "expert", "expect"], ans: 1 },
        { level: 'B1', type: 'conversation', q: "A: Do you mind if I open the window? \nB: ___", opts: ["Yes, please do.", "No, not at all.", "I open window.", "Mind is okay."], ans: 1 },
        { level: 'B1', type: 'listening', q: "The museum exhibits artifacts from ancient Egypt.", opts: ["Modern art", "Ancient Egypt", "Future technology", "Dinosaurs"], ans: 1 },
        { level: 'B1', type: 'grammar', q: "The book, ___ was written in 1920, is a classic.", opts: ["who", "which", "that", "where"], ans: 1 },
        { level: 'B1', type: 'vocab', q: "We need to ___ our natural resources.", opts: ["consume", "conserve", "destroy", "pollute"], ans: 1 },

        // B2 Level
        { level: 'B2', type: 'grammar', q: "Had I known about the storm, I ___ have planned the hike.", opts: ["won't", "wouldn't", "didn't", "haven't"], ans: 1 },
        { level: 'B2', type: 'vocab', q: "The melting glaciers are a ___ consequence of global warming.", opts: ["trivial", "profound", "negligible", "dubious"], ans: 1 },
        { level: 'B2', type: 'conversation', q: "A: The new policy seems rather draconian, doesn't it? \nB: ___", opts: ["Indeed, it leaves little room for flexibility.", "Yes, dragons are scary.", "I think policy is new.", "No, draconian."], ans: 0 },
        { level: 'B2', type: 'listening', q: "The phenomenon of bioluminescence is prevalent among deep-sea organisms.", opts: ["Deep-sea organisms", "Forest animals", "Desert plants", "Birds"], ans: 0 },
        { level: 'B2', type: 'grammar', q: "Scarcely ___ the tent when the downpour began.", opts: ["we had pitched", "had we pitched", "did we pitch", "we pitched"], ans: 1 },
        { level: 'B2', type: 'vocab', q: "The researcher provided ___ evidence to support her hypothesis.", opts: ["flimsy", "anecdotal", "compelling", "irrelevant"], ans: 2 },
        { level: 'B2', type: 'conversation', q: "A: What's your take on the renewable energy initiative? \nB: ___", opts: ["I take energy.", "It's a step in the right direction, albeit costly.", "Renewable is good.", "Initiative is take."], ans: 1 },
        { level: 'B2', type: 'listening', q: "The tectonic plates shift imperceptibly over millennia.", opts: ["Quickly", "Imperceptibly", "Loudly", "Visibly"], ans: 1 },
        { level: 'B2', type: 'grammar', q: "He speaks Spanish as though he ___ a native speaker.", opts: ["is", "was", "were", "has been"], ans: 2 },
        { level: 'B2', type: 'vocab', q: "The ecosystem is highly ___ to invasive species.", opts: ["resistant", "immune", "susceptible", "indifferent"], ans: 2 }
    ];

    // ==========================================
    // 3. Game State & Logic
    // ==========================================
    let player = "";
    let score = 0;
    let questionCount = 0;
    const maxQuestions = 40;
    let currentLevel = 'A2'; // Start level
    let availableQuestions = [];
    let currentQuestionData = null;
    let selectedOptionIndex = null;
    
    // Timer states
    let currentPart = 1; // 1 to 3
    let timeRemaining = 15 * 60; // 15 minutes per part
    let timerInterval = null;

    // Point mapping
    const levelPoints = { 'A1': 1, 'A2': 2, 'B1': 3, 'B2': 4 };

    // Deep copy pool to manage used questions
    function resetPool() {
        availableQuestions = JSON.parse(JSON.stringify(questionsDb));
    }

    function login() {
        const nameInput = document.getElementById('nickname-input').value.trim();
        if (nameInput === "") {
            alert("Please enter a nickname.");
            return;
        }
        player = nameInput;
        document.getElementById('player-name-display').innerText = `Explorer: ${player}`;
        
        document.getElementById('login-screen').classList.add('hidden');
        document.getElementById('quiz-screen').classList.remove('hidden');
        
        resetPool();
        score = 0;
        questionCount = 0;
        currentPart = 1;
        startPartTimer();
        loadNextQuestion();
    }

    function startPartTimer() {
        clearInterval(timerInterval);
        timeRemaining = 15 * 60; // 15 mins
        document.getElementById('part-display').innerText = `Part: ${currentPart}/3`;
        
        timerInterval = setInterval(() => {
            timeRemaining--;
            let mins = Math.floor(timeRemaining / 60);
            let secs = timeRemaining % 60;
            document.getElementById('timer-display').innerText = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
            
            if (timeRemaining <= 0) {
                clearInterval(timerInterval);
                alert(`Time is up for Part ${currentPart}!`);
                handlePartTransition();
            }
        }, 1000);
    }

    function handlePartTransition() {
        if (currentPart >= 3) {
            endQuiz();
        } else {
            currentPart++;
            startPartTimer();
            loadNextQuestion();
        }
    }

    function getQuestionFromLevel(level) {
        let pool = availableQuestions.filter(q => q.level === level);
        if (pool.length > 0) {
            let randomIndex = Math.floor(Math.random() * pool.length);
            let q = pool[randomIndex];
            // Remove from pool
            let globalIndex = availableQuestions.findIndex(item => item.q === q.q);
            if (globalIndex > -1) availableQuestions.splice(globalIndex, 1);
            return q;
        }
        return null;
    }

    function loadNextQuestion() {
        if (questionCount >= maxQuestions) {
            endQuiz();
            return;
        }
        
        // Check part transition based on question count (13, 13, 14 roughly)
        if (questionCount === 13 && currentPart === 1) {
            currentPart = 2; startPartTimer();
        } else if (questionCount === 26 && currentPart === 2) {
            currentPart = 3; startPartTimer();
        }

        selectedOptionIndex = null;
        let btn = document.getElementById('next-btn');
        btn.disabled = true;
        btn.style.backgroundColor = "#555";
        btn.style.color = "#888";
        btn.style.cursor = "not-allowed";

        // FALLBACK MECHANISM: If current level runs out, find closest available level
        currentQuestionData = getQuestionFromLevel(currentLevel);
        if (!currentQuestionData) {
            const levelsFallbackOrder = ['A2', 'B1', 'A1', 'B2'];
            for (let lvl of levelsFallbackOrder) {
                currentQuestionData = getQuestionFromLevel(lvl);
                if (currentQuestionData) {
                    currentLevel = lvl;
                    break;
                }
            }
        }

        if (!currentQuestionData) {
            // Pool completely empty
            endQuiz();
            return;
        }

        renderQuestion();
    }

    function renderQuestion() {
        document.getElementById('question-type').innerText = `${currentQuestionData.type} - Level ${currentQuestionData.level} (Question ${questionCount + 1}/${maxQuestions})`;
        document.getElementById('question-text').innerText = currentQuestionData.q;
        
        const audioBtn = document.getElementById('play-audio-btn');
        if (currentQuestionData.type === 'listening') {
            audioBtn.classList.remove('hidden');
        } else {
            audioBtn.classList.add('hidden');
        }

        const optArea = document.getElementById('options-area');
        optArea.innerHTML = "";
        
        currentQuestionData.opts.forEach((optText, index) => {
            let btn = document.createElement('button');
            btn.className = "option-btn";
            btn.innerText = optText;
            btn.onclick = () => selectOption(index, btn);
            optArea.appendChild(btn);
        });
    }

    function selectOption(index, btnElement) {
        selectedOptionIndex = index;
        
        let allBtns = document.querySelectorAll('.option-btn');
        allBtns.forEach(b => b.classList.remove('selected'));
        btnElement.classList.add('selected');
        
        let nextBtn = document.getElementById('next-btn');
        nextBtn.disabled = false;
        nextBtn.style.backgroundColor = "var(--ng-yellow)";
        nextBtn.style.color = "var(--ng-dark)";
        nextBtn.style.cursor = "pointer";
    }

    // Web Speech API for Listening part
    document.getElementById('play-audio-btn').addEventListener('click', () => {
        if (!currentQuestionData) return;
        if ('speechSynthesis' in window) {
            const utterance = new SpeechSynthesisUtterance(currentQuestionData.q);
            utterance.lang = 'en-US';
            utterance.rate = 0.9;
            window.speechSynthesis.speak(utterance);
        } else {
            alert("Your browser does not support text-to-speech.");
        }
    });

    function submitAnswer() {
        if (selectedOptionIndex === null) return;
        
        let isCorrect = (selectedOptionIndex === currentQuestionData.ans);
        
        if (isCorrect) {
            score += levelPoints[currentLevel];
            // Level Up logic
            if (currentLevel === 'A1') currentLevel = 'A2';
            else if (currentLevel === 'A2') currentLevel = 'B1';
            else if (currentLevel === 'B1') currentLevel = 'B2';
        } else {
            // Level Down logic
            if (currentLevel === 'B2') currentLevel = 'B1';
            else if (currentLevel === 'B1') currentLevel = 'A2';
            else if (currentLevel === 'A2') currentLevel = 'A1';
        }
        
        questionCount++;
        loadNextQuestion();
    }

    function confirmEarlyExit() {
        if(confirm("Are you sure you want to end the test early and save your current score?")) {
            endQuiz();
        }
    }

    function endQuiz() {
        clearInterval(timerInterval);
        document.getElementById('quiz-screen').classList.add('hidden');
        document.getElementById('result-screen').classList.remove('hidden');
        
        document.getElementById('final-score').innerText = score;
        
        // Max possible score theoretically if always B2 is 40 * 4 = 160.
        let cefr = "A1";
        let desc = "Foundation Level: Keep exploring and practicing basic English structures.";
        
        if (score >= 100) {
            cefr = "B2"; desc = "Upper Intermediate: Excellent command of the language. Ready for global expeditions!";
        } else if (score >= 60) {
            cefr = "B1"; desc = "Intermediate: Solid understanding. You can navigate most situations independently.";
        } else if (score >= 30) {
            cefr = "A2"; desc = "Pre-Intermediate: Good progress. Focus on expanding vocabulary and complex grammar.";
        }
        
        document.getElementById('cefr-level').innerText = `CEFR Level: ${cefr}`;
        document.getElementById('cefr-desc').innerText = desc;
        
        saveScoreToDatabase(player, score, cefr);
    }

    // ==========================================
    // 4. Firebase Database Functions
    // ==========================================
    function saveScoreToDatabase(playerName, finalScore, cefrLvl) {
        // Prevent saving if db is not configured
        if(firebaseConfig.apiKey === "YOUR_API_KEY") {
            console.warn("Firebase is not configured. Score not saved to cloud.");
            return;
        }

        const dateStr = new Date().toLocaleString('th-TH');
        db.ref('leaderboard/').push({
            name: playerName,
            score: finalScore,
            level: cefrLvl,
            date: dateStr
        }).catch((error) => {
            console.error("Error saving to Firebase:", error);
        });
    }

    function showLeaderboard() {
        document.getElementById('login-screen').classList.add('hidden');
        document.getElementById('quiz-screen').classList.add('hidden');
        document.getElementById('result-screen').classList.add('hidden');
        document.getElementById('leaderboard-screen').classList.remove('hidden');
        
        if(firebaseConfig.apiKey === "YOUR_API_KEY") {
            document.getElementById('leaderboard-body').innerHTML = `<tr><td colspan="4" style="text-align: center; color: red;">Database not configured. Please add your Firebase keys.</td></tr>`;
            return;
        }

        const tbody = document.getElementById('leaderboard-body');
        tbody.innerHTML = `<tr><td colspan="4" style="text-align: center;">Loading data...</td></tr>`;
        
        db.ref('leaderboard/').orderByChild('score').once('value').then((snapshot) => {
            if (snapshot.exists()) {
                let dataArr = [];
                snapshot.forEach((child) => {
                    dataArr.push(child.val());
                });
                
                // Sort descending by score
                dataArr.sort((a, b) => b.score - a.score);
                
                tbody.innerHTML = "";
                dataArr.forEach(row => {
                    let tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${row.name}</td>
                        <td><strong>${row.score}</strong></td>
                        <td>${row.level}</td>
                        <td style="font-size: 12px; color: #aaa;">${row.date}</td>
                    `;
                    tbody.appendChild(tr);
                });
            } else {
                tbody.innerHTML = `<tr><td colspan="4" style="text-align: center;">No records found.</td></tr>`;
            }
        }).catch(err => {
            tbody.innerHTML = `<tr><td colspan="4" style="text-align: center; color: red;">Error loading data.</td></tr>`;
            console.error(err);
        });
    }
</script>

</body>
</html>
